# Cloudflare Pages 项目配置
# 部署：在本目录执行
#   npx wrangler pages deploy . --project-name mp-share
# functions/ 下的文件会自动变成 Pages Functions，无需在此声明路由。
#
# ⚠ pages_build_output_dir 必须存在：缺了它 wrangler 会打印
#   "Ignoring configuration file for now" 并**整份忽略本文件** —— 那样下面的 KV 绑定也不会生效
#   （实测踩过：health 一直返回 kv:false）。
# 本目录没有静态文件（只有 functions/），所以指向自身即可。
name = "mp-share"
pages_build_output_dir = "."
compatibility_date = "2024-09-23"

# KV 绑定：变量名必须正好是 MP_KV（函数里就是读 env.MP_KV）。
# 与 Worker 共用同一个 KV 命名空间 —— 短链数据两边互通。
[[kv_namespaces]]
binding = "MP_KV"
id = "aa5fde809e7f4e9ba3f7feb8518c84c8"

# 可选：Cloudflare 原生 Rate Limiting 绑定。
# 服务端**默认已有内存限流**（每 IP 每小时 30 次创建，且不消耗 KV 写额度），
# 这里的绑定是更准的一层（跨 isolate）。不绑定也能用，只是内存限流是尽力而为。
# [[unsafe.bindings]]
# name = "RATE_LIMIT"
# type = "ratelimit"
# namespace_id = "1001"
# simple = { limit = 30, period = 3600 }
