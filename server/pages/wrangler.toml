# Cloudflare Pages 项目配置（可选）
# 用 `npx wrangler pages deploy . --project-name mp-share` 部署本目录。
# functions/ 下的文件会自动变成 Pages Functions，无需在此声明路由。
name = "mp-share"
compatibility_date = "2024-09-23"

# KV 绑定：Pages 里更推荐用控制台绑定（Settings → Functions → KV namespace bindings），
# 变量名必须是 MP_KV。若想用文件声明，取消下面注释并填 id：
# [[kv_namespaces]]
# binding = "MP_KV"
# id = "你的KV命名空间id"