<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- 跨文档 View Transition 的 opt-in 双保险（批 C 诊断）：与 css/theme.css 的 @view-transition{navigation:auto}
     等价、互相兼容；这是 W3C 推荐的早期写法，Chromium 111+ 就认，旧浏览器忽略本行不会报错 -->
<meta name="view-transition" content="same-origin">
<!-- 对外访问地址：分享链接与分享卡片二维码用它拼，**不能用 location.origin**——
     本地起服务时那是 localhost，别人扫了/点了都打不开。自行部署请改这两行。 -->
<link rel="canonical" href="https://yhl4466.github.io/music-studio-pro/visualizer.html">
<meta name="mp-share-base" content="https://yhl4466.github.io/music-studio-pro/">
<!-- 分享短链后端地址（可选）。**默认留空 = 短链功能自动禁用**，其余不受影响。
     此前这里硬编码了作者的生产后端，会让任何 fork 的用户数据默认 POST 到作者那里；
     现改为留空。要用短链，在「设置 → 短链后端」填自己的地址，或把本行改成自己的部署地址
     （详见 index.html 里的完整说明与 server/README.md）。 -->
<meta name="mp-api-base" content="">
<title>音乐可视化 · 智能音乐工坊 PRO</title>
<!-- 基础描述与分享预览。可视化页已不再是分享链接的目标页（见 js/io/siteUrl.js 的 SHARE_PAGE），
     但它仍可被单独访问/被搜索引擎收录，所以保留一份精简的 meta。 -->
<meta name="description" content="智能音乐工坊 PRO 的音乐可视化：波形、频谱、粒子等渲染器，可离线渲染并导出封面与分享卡片。">
<meta name="robots" content="noindex">
<meta property="og:title" content="音乐可视化 · 智能音乐工坊 PRO">
<meta property="og:description" content="波形、频谱、粒子等音乐可视化渲染器，可导出封面与分享卡片。">
<meta property="og:image" content="https://yhl4466.github.io/music-studio-pro/assets/og-image.svg">
<meta property="og:locale" content="zh_CN">
<link rel="stylesheet" href="./css/theme.css">
<link rel="stylesheet" href="./css/viz.css">
<link rel="icon" href="./assets/favicon.svg">
<!-- 主题在解析阶段就写入 documentElement，避免模块加载前的配色闪烁（只读 mpTheme，不写） -->
<script>try{document.documentElement.dataset.theme=localStorage.getItem('mpTheme')||'studio'}catch(e){document.documentElement.dataset.theme='studio'}</script>
<script type="module" src="./js/viz/main.js"></script>
</head>
<body>

<!-- 顶栏（批 B 简洁化）：12 个可见元素 → 9 个
     · 返回按钮收成纯图标（文字进 .vz-sr，title/aria-label 保留）
     · 时间只在大时钟一处显示（#vzTime 保留 id 与更新逻辑，视觉隐藏）
     · 「渲染器」「渲染长度」的中文标签进 .vz-sr（不占位，aria-label/title 保留）
     · 渲染长度移入齿轮菜单（#vzLen 原样保留，功能不变）
     · 「取消」只在渲染/分析期间出现（元素与逻辑保留，data-busy 控制） -->
<header class="vz-top">
  <!-- 品牌小 logo（批 C 第一部分）：与主应用 .logo 共用 view-transition-name:app-logo（css/theme.css），
       跨页跳转时由它完成"同一个应用换视图"的连续感 -->
  <div class="vz-logo" aria-hidden="true"></div>
  <a class="vz-back" id="vzBack" href="./index.html" title="返回主应用" aria-label="返回主应用">
    <span class="vz-ico" aria-hidden="true">&#8249;</span>
    <span class="vz-sr">返回主应用</span>
  </a>
  <div class="vz-sep"></div>
  <button class="vz-play" id="vzPlay" title="播放 / 暂停 (空格)" disabled>
    <svg id="vzPlayIco" class="vz-svg" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg>
    <svg id="vzPauseIco" class="vz-svg" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true" style="display:none"><rect x="7" y="5" width="3.6" height="14" rx="1.2"/><rect x="13.4" y="5" width="3.6" height="14" rx="1.2"/></svg>
    <span class="vz-sr" id="vzPlayTxt">播放</span>
  </button>
  <button class="vz-play" id="vzStop" title="停止并回到开头" disabled>
    <svg class="vz-svg" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="6.5" y="6.5" width="11" height="11" rx="1.8"/></svg>
    <span class="vz-sr">停止</span>
  </button>
  <button class="vz-cancel" id="vzCancel" title="取消正在进行的离线渲染" disabled>取消</button>
  <div class="vz-pos">
    <div class="vz-posMain" id="vzPosMain">0:00 / 0:00</div>
    <div class="vz-posSub" id="vzPosSub">未载入工程</div>
  </div>
  <input class="vz-range" id="vzSeek" type="range" min="0" max="1000" value="0" step="1" aria-label="播放进度" disabled>
  <!-- 兼容保留：#vzTime 的 id 与文本更新逻辑仍在（main.js paint() 会写），但视觉上隐藏 ——
       时间统一由左侧大时钟显示"当前 / 总长"，避免同一屏报三次时间 -->
  <span class="vz-time vz-hide" id="vzTime" aria-hidden="true">0:00 / 0:00</span>
  <div class="vz-sep"></div>
  <label class="vz-lab">
    <span class="vz-sr">渲染器</span>
    <select class="vz-select" id="vzPick" aria-label="渲染器切换" title="渲染器切换（8 种可视化）">
      <option value="waveform">实时波形</option>
    </select>
  </label>
  <div class="vz-menuWrap" id="vzSetWrap">
    <button class="vz-play vz-setBtn" id="vzSetBtn" title="设置：渲染长度（默认 30 秒）" aria-label="设置" aria-haspopup="true" aria-expanded="false">
      <span class="vz-setIco" aria-hidden="true"></span>
    </button>
    <div class="vz-menu" id="vzSetMenu" role="menu" aria-label="设置">
      <div class="vz-menuItem">
        <label class="vz-menuLab">渲染长度
          <select class="vz-select" id="vzLen" aria-label="预渲染长度" title="预渲染长度：越短越快看到效果，「全曲」会渲染整首（长曲较慢）">
            <option value="30" selected>30 秒</option>
            <option value="60">60 秒</option>
            <option value="90">90 秒</option>
            <option value="full">全曲</option>
          </select>
        </label>
      </div>
      <div class="vz-menuHint">预览用 30 秒足够；切到「全曲」后才能分析整首（封面 / 指纹）。</div>
      <div class="vz-menuDiv" aria-hidden="true"></div>
      <div class="vz-menuItem">
        <label class="vz-menuLab">分享地址
          <input class="vz-inp" id="vzSiteUrl" type="url" inputmode="url" spellcheck="false"
            placeholder="https://你的域名/项目/" aria-label="分享卡片使用的对外地址">
        </label>
      </div>
      <div class="vz-menuHint" id="vzSiteHint">分享卡片上的二维码与链接用它拼。</div>
      <div class="vz-menuRow">
        <button class="vz-mi" id="vzSiteSave" type="button">保存地址</button>
        <button class="vz-mi" id="vzSiteReset" type="button">恢复默认</button>
      </div>
      <div class="vz-menuDiv" aria-hidden="true"></div>
      <div class="vz-menuItem">
        <label class="vz-menuLab">短链后端
          <input class="vz-inp" id="vzApiBase" type="url" inputmode="url" spellcheck="false"
            placeholder="https://mp-share.xxx.workers.dev" aria-label="分享短链后端地址">
        </label>
      </div>
      <div class="vz-menuHint" id="vzApiHint">留空则短链不可用（其余功能不受影响）。</div>
      <div class="vz-menuRow">
        <button class="vz-mi" id="vzApiSave" type="button">保存后端</button>
        <button class="vz-mi" id="vzApiTest" type="button">测试连通</button>
      </div>
    </div>
  </div>
  <button class="vz-btn" id="vzCoverBtn" title="分析整曲并生成专辑封面（预览 / 下载 PNG）">
    <!-- 图标本体在 css/viz.css 的 .vz-btn-ico（mask 线性图标）；coverUI 运行时写入的字符已被 font-size:0 隐掉 -->
    <span class="vz-btn-ico" id="vzCoverIco" aria-hidden="true"></span>
    <span class="vz-btn-txt">生成封面</span>
  </button>
</header>

<main class="vz-stage" id="vzStage">
  <canvas class="vz-canvas" id="vzCanvas"></canvas>
  <div class="vz-overlay" id="vzOverlay">
    <div class="vz-card">
      <div class="vz-cardT"><span class="vz-ico" aria-hidden="true">&#9670;</span>音乐可视化</div>
      <div class="vz-cardB" id="vzCardBody">正在初始化…</div>
    </div>
  </div>
  <div class="vz-overlay off" id="vzCoverModal">
    <div class="vz-card vz-cover-card">
      <!-- 弹窗头部（批 B）：主操作「下载 PNG」上移到标题行，控件行因此少一行；
           2× 高清与"以 2× 下载"收进右侧 ▾ 菜单（#vzCoverHd 原样保留） -->
      <div class="vz-cover-head">
        <span class="vz-cover-title">生成封面</span>
        <span class="vz-cover-note" id="vzCoverNote"></span>
        <button type="button" class="vz-btn acc vz-sm" id="vzCoverDownload" title="导出 PNG（当前分辨率）">下载 PNG</button>
        <div class="vz-menuWrap">
          <button type="button" class="vz-btn vz-sm vz-dlMore" id="vzDlMore" title="下载与导出选项" aria-label="下载选项" aria-haspopup="true" aria-expanded="false">
            <span class="vz-caret" aria-hidden="true"></span>
          </button>
          <div class="vz-menu vz-menuRight" id="vzDlMenu" role="menu" aria-label="下载选项">
            <label class="vz-menuItem vz-hdItem" title="以 2× 分辨率离屏重绘后导出（封面 1600×1600 / 指纹 3840×800 / 分享卡片 2400×1260）">
              <input type="checkbox" id="vzCoverHd"> 高清导出 2×
            </label>
            <button type="button" class="vz-mi" id="vzDl2x" title="临时按 2× 分辨率导出一次（不改动上面的勾选状态）">以 2× 分辨率下载</button>
<button type="button" class="vz-mi" id="vzShortLink" title="把当前工程上传到短链后端，二维码里只放 8 位 ID（一张普通二维码即可扫出整份谱子）">生成短链二维码</button>
          </div>
        </div>
        <button type="button" class="vz-cover-x" id="vzCoverClose" title="关闭（Esc）">×</button>
      </div>
      <div class="vz-cover-kinds" id="vzCoverKinds">
        <button type="button" data-kind="cover" class="on">专辑封面</button>
        <button type="button" data-kind="fingerprint">音乐指纹</button>
        <button type="button" data-kind="sharecard">分享卡片</button>
      </div>
      <div class="vz-cover-body" id="vzCoverBody">
        <canvas class="vz-cover-canvas" id="vzCoverCanvas" width="800" height="800"></canvas>
      </div>
      <div class="vz-cover-tabs" id="vzCoverStyles">
        <button type="button" data-style="ring" class="on">同心声纹</button>
        <button type="button" data-style="bricks">能量砖阵</button>
        <button type="button" data-style="ribbon">波形缎带</button>
      </div>
      <!-- 一行控件：曲名 + 种子 + 换一张（都是"出图输入"，合并后少一行） -->
      <div class="vz-cover-actions">
        <label class="vz-cover-seed wide" title="曲名（会打印在图上）">
          <span class="vz-sr">曲名</span>
          <input type="text" id="vzCoverTitle" maxlength="40" placeholder="未命名工程" autocomplete="off">
        </label>
        <label class="vz-cover-seed" title="种子：同一工程 + 同一种子 → 出图完全一致">
          种子
          <input type="number" id="vzCoverSeed" min="0" max="1000000000" step="1" value="1">
        </label>
        <button type="button" class="vz-btn vz-sm" id="vzCoverShuffle" title="换一个种子，换一张图（同一工程同一种子出图完全一致）">换一张</button>
      </div>
    </div>
  </div>
  <div class="vz-fps" id="vzFps" title="帧率（F 键显示/隐藏；低于 45 会自动出现）">-- FPS</div>
</main>

<footer class="vz-bottom">
  <div class="vz-bar">
    <!-- 提示行（批 B）：可见文本只有「状态徽标 + 关键量」，长详情进 title（悬停可看，信息不丢） -->
    <span class="vz-hint" id="vzHint">V1 步骤 2/7：正在初始化数据层…</span>
    <span class="vz-spacer"></span>
    <!-- 版本标记：用来一眼判断"浏览器是否还在跑缓存的旧代码"。
         GitHub Pages 给静态资源发 Cache-Control: max-age=600，推送后 10 分钟内
         刷新页面仍可能执行旧模块（本会话实测因此误判过三次）。
         改代码时**请随手改一下这个数字**（如 v3 → v4），就不用再猜缓存了。 -->
    <span class="vz-build" id="vzBuild" title="代码版本标记：发新版后这里会变。若与最新提交不一致，说明浏览器在用缓存的旧模块，硬刷新（Ctrl+Shift+R）即可。">build v5</span>
    <span class="vz-lab" id="vzRenderLab">预渲染</span>
    <div class="vz-prog" id="vzRenderBar"><i id="vzRenderFill"></i></div>
  </div>
  <div class="vz-params" id="vzParams"></div>
</footer>

</body>
</html>
